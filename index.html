<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#534AB7">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenda familiar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="estilos.css">
  <!-- Descargar en paralelo las piezas que la app necesita al abrir -->
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="sdk/firebase-app.js">
  <link rel="modulepreload" href="sdk/firebase-auth.js">
  <link rel="modulepreload" href="sdk/firebase-firestore.js">
</head>
<body>
  <!-- Cargando (se ve de inmediato; si algo falla muestra cómo reintentar) -->
  <section id="cargando" class="login">
    <div class="login-caja">
      <img src="icon-192.png" alt="" width="72" height="72">
      <h1>Agenda familiar</h1>
      <p id="cargando-msg">Cargando…</p>
      <button id="btn-reintentar" class="btn primario grande oculto" onclick="location.reload()">Reintentar</button>
    </div>
  </section>

  <!-- Pantalla de entrada -->
  <section id="pantalla-login" class="login oculto">
    <div class="login-caja">
      <img src="icon-192.png" alt="" width="72" height="72">
      <h1 id="login-titulo">Agenda familiar</h1>
      <p id="login-msg">Solo para nosotros dos. Entra con tu cuenta de Google.</p>
      <button id="btn-login" class="btn primario grande">Entrar con Google</button>
    </div>
  </section>

  <!-- App -->
  <section id="pantalla-app" class="oculto">
    <header class="cabecera">
      <div>
        <p class="cab-fecha" id="cab-fecha"></p>
        <h1 class="cab-titulo" id="cab-titulo">Hoy</h1>
      </div>
      <div class="cab-avatares" id="cab-avatares"></div>
    </header>

    <main id="vista"></main>

    <nav class="nav">
      <button data-nav="hoy" class="activo"><span class="ico">⌂</span>Hoy</button>
      <button data-nav="calendario"><span class="ico">▦</span>Calendario</button>
      <button data-nav="nuevo" class="nav-mas"><span class="ico">＋</span>Agregar</button>
      <button data-nav="listas"><span class="ico">☑</span>Listas</button>
      <button data-nav="ajustes"><span class="ico">⚙</span>Ajustes</button>
    </nav>
  </section>

  <!-- Hoja inferior (formularios y detalles) -->
  <div id="velo" class="velo oculto"></div>
  <div id="hoja" class="hoja oculto" role="dialog" aria-modal="true"></div>

  <div id="toast" class="toast oculto"></div>

  <script>
    // Mostrar al instante la pantalla "Hoy" tal como quedó la última vez, mientras carga lo demás
    (function () {
      try {
        if (!localStorage.getItem("ultimoUsuario")) return;
        var f = JSON.parse(localStorage.getItem("fotoHoy") || "null");
        var d = new Date(), hoy = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        document.getElementById("cargando").classList.add("oculto");
        document.getElementById("pantalla-app").classList.remove("oculto");
        document.body.classList.add("foto");
        var fecha = d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }).replace(",", "");
        document.getElementById("cab-fecha").textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);
        document.getElementById("vista").innerHTML = f && f.dia === hoy ? f.html : '<p class="vacio" style="padding:24px 4px">Abriendo tu agenda…</p>';
        if (f && f.av) document.getElementById("cab-avatares").innerHTML = f.av;
      } catch (e) { /* si algo falla, se ve la pantalla normal de carga */ }
    })();
    // Si en 12 segundos no cargó (sin señal o error), ofrecer reintentar
    window.__falloCarga = function (msg) {
      var c = document.getElementById("cargando");
      if (!c || c.classList.contains("oculto") || !document.getElementById("btn-reintentar").classList.contains("oculto")) return;
      document.getElementById("cargando-msg").textContent = msg;
      document.getElementById("btn-reintentar").classList.remove("oculto");
    };
    if ("serviceWorker" in navigator) {
      var habiaSW = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
        reg.update().catch(function () {});   // buscar versión nueva en cada apertura
      }).catch(function () {});
      // Cuando se instala una versión nueva, recargar una sola vez para mostrarla
      navigator.serviceWorker.addEventListener("message", function (e) {
        if (e.data && e.data.tipo === "actualizada" && habiaSW && !sessionStorage.getItem("recargada-" + e.data.version)) {
          sessionStorage.setItem("recargada-" + e.data.version, "1");
          location.reload();
        }
      });
    }
    setTimeout(function () { window.__falloCarga("Está tardando. Revisa tu señal o internet y toca Reintentar."); }, 12000);
    window.addEventListener("error", function (e) {
      if (e && e.target && e.target.tagName === "SCRIPT") window.__falloCarga("No se pudo cargar la app. Revisa tu internet y toca Reintentar.");
    }, true);
  </script>
  <script type="module" src="app.js" onerror="window.__falloCarga('No se pudo cargar la app. Revisa tu internet y toca Reintentar.')"></script>
</body>
</html>

name: Avisos de la agenda

# Cada 10 minutos: copia Google Calendar ↔ app y manda los avisos al celular.
# Domingos 7:00 p.m. (CDMX): resumen de la semana.
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 1 * * 1"      # lunes 01:00 UTC = domingo 7:00 p.m. en CDMX
  workflow_dispatch:          # botón "Run workflow" para probar a mano
    inputs:
      modo:
        description: "avisos, resumen o prueba"
        default: "prueba"

permissions:
  contents: read
  actions: write   # para mantener activo el horario (último paso)

concurrency:
  group: avisos
  cancel-in-progress: false

defaults:
  run:
    working-directory: servidor

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servidor/requirements.txt
      - run: pip install -r requirements.txt

      - name: Revisar configuración
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions)."
            exit 0
          fi
          echo "CONFIG_OK=1" >> "$GITHUB_ENV"

      - name: Sincronizar calendario y enviar avisos
        if: env.CONFIG_OK == '1'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCAL_ICS_MAMA: ${{ secrets.GCAL_ICS_MAMA }}
          GCAL_ICS_PAPA: ${{ secrets.GCAL_ICS_PAPA }}
          GCAL_FAMILIA_ID: ${{ secrets.GCAL_FAMILIA_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODO="${{ github.event.inputs.modo }}"
          elif [ "${{ github.event.schedule }}" = "0 1 * * 1" ]; then
            MODO="resumen"
          else
            MODO="avisos"
          fi
          case "$MODO" in
            resumen) python avisos.py --resumen ;;
            prueba)  python avisos.py && python avisos.py --prueba ;;
            *)       python avisos.py ;;
          esac

      # GitHub pausa los horarios de repos sin actividad en 60 días; esto los mantiene activos.
      - name: Mantener activo
        if: github.event.schedule == '0 1 * * 1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable" || true
